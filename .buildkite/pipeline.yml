steps:
  - label: ":shell: Shellcheck"
    plugins:
      shellcheck#v1.4.0:
        files: hooks/**

  - label: ":sparkles: Lint"
    plugins:
      plugin-linter#v4.0.0:
        id: avaly/gcp-secret-manager

  - label: ":docker: Tests"
    plugins:
      docker-compose#v5.15.0:
        run: tests
